appId: com.flowershouse.app
productName: Flower's House
copyright: Copyright © 2026 Flower's House

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

# Auto-update feed. The renderer asks electron-updater to read latest.yml from
# the newest GitHub release of this repository (it must stay public).
publish:
  provider: github
  owner: SpectreForge-house
  repo: flowers-house
  releaseType: release

asar: true
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FlowersHouse-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flower's House
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
