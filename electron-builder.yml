appId: com.flowershouse.app
productName: Flower's House
copyright: Copyright © 2026 Flower's House

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

asar: true
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: FlowersHouse-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flower's House
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
