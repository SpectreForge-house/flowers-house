appId: com.flowershouse.crm
productName: Flower's House CRM
copyright: Copyright © 2026 Flower's House

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

asar: true
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Flower's House CRM
